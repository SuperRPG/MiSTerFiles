# Copie para /media/fat/Scripts/.MiSTerFiles/MiSTerFiles.ini e ajuste.
# Tamanho do framebuffer. Vazio = automatico:
#   TV/CRT 15 kHz (fb_terminal=2, vga_scaler=0): usa o 640x240 do MiSTer
#   HDMI / scaler: 640x480
FB_WIDTH=
FB_HEIGHT=
# Margem de seguranca (overscan) em % da altura da tela, igual nos 4 lados (0-15).
# Ajuste pelo proprio app: Y (ou Tab) -> "Tela / Overscan". O app grava aqui.
OVERSCAN=0
# Layout: auto | small (letra menor, para 240 linhas) | large (para 480 linhas)
LAYOUT=auto
# Pasta inicial
START_DIR="/media/fat"
# 1 = se fb_terminal=0, ativa o framebuffer temporariamente (MiSTer.ini nao e alterado)
AUTO_FB=1
# 1 = ler o controle direto pelo SDL (so se o mapeamento do MiSTer nao funcionar)
MF_JOYSTICK=0
# 1 = trocar vermelho/azul se as cores aparecerem erradas
MF_SWAP_RB=0
